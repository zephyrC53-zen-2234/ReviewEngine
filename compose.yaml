services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reviewengine
      POSTGRES_PASSWORD: reviewengine_local
      POSTGRES_DB: reviewengine
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - reviewengine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewengine -d reviewengine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reviewengine-data:
